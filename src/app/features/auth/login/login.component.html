<div class="auth-container">

  <div class="auth-card">

    <h1>Welcome Back</h1>

    <p>Sign in to your AI assistant</p>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="login()"
    >

      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          formControlName="email"
          placeholder="Enter your email"
        >

      </div>

      <div class="form-group">

        <label>Password</label>

        <input
          type="password"
          formControlName="password"
          placeholder="Enter your password"
        >

      </div>

      <div
        class="error"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        [disabled]="loading"
      >

        {{ loading ? 'Signing in...' : 'Sign In' }}

      </button>

    </form>

    <p class="register-link">

      Don't have an account?

      <a routerLink="/register">
        Create account
      </a>

    </p>

  </div>

</div>
