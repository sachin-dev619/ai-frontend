<div class="chat-window">

  <!-- Header -->
  <header class="chat-header">

    <div>
      <h3>AI Assistant</h3>

      <span>
        Online Free AI
      </span>
    </div>

  </header>


  <!-- Messages -->

  <div class="messages">

    <div
      *ngIf="!conversationId"
      class="welcome">

      <div class="welcome-icon">
        ✨
      </div>

      <h1>How can I help you?</h1>

      <p>
        Ask anything — replies come from free online AI.
      </p>

    </div>


    <app-message-item
      *ngFor="let message of messages"
      [message]="message">
    </app-message-item>

  </div>


  <!-- Input -->

  <app-message-input
    [conversationId]="conversationId"
    (conversationCreated)="onConversationCreated($event)"
    (messagesSent)="onMessagesSent($event)">
  </app-message-input>

</div>
