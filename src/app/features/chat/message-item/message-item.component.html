<div
  class="message"
  [class.user-message]="message.role === 'user'"
  [class.assistant-message]="message.role === 'assistant'">

  <div class="avatar">

    <span *ngIf="message.role === 'user'">
      You
    </span>

    <span *ngIf="message.role === 'assistant'">
      AI
    </span>

  </div>

  <div class="content">

    <div class="role">
      {{ message.role === 'user' ? 'You' : 'AI Assistant' }}
    </div>

    <div class="text">
      {{ message.content }}
    </div>

  </div>

</div>
