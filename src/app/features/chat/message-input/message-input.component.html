<div class="input-container">

  <div class="input-wrapper">

    <textarea
      [(ngModel)]="message"
      placeholder="Message your AI assistant..."
      rows="1"
      [disabled]="sending"
      (keydown.enter)="$event.preventDefault(); sendMessage()">
    </textarea>

    <button
      (click)="sendMessage()"
      [disabled]="!message.trim() || sending">

      <span *ngIf="!sending">
        ➤
      </span>

      <span *ngIf="sending">
        ...
      </span>

    </button>

  </div>

  <small>
    Mode: Online free AI (Gemini) — Ollama/local not enabled yet
  </small>

</div>
